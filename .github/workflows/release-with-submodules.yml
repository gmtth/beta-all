name: Release with submodules

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Atualizar submodules
        shell: bash
        run: |
          git submodule foreach --recursive '
            git fetch --prune origin
            branch=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD || true)

            if [ -z "$branch" ]; then
              branch="origin/$(git remote show origin | sed -n "/HEAD branch/s/.*: //p")"
            fi

            git checkout --detach "$branch"
          '

      - name: Criar pacote incorporado
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p package/suite-beta dist

          rsync -a --exclude='.git' ./ package/suite-beta/
          git submodule status --recursive > package/suite-beta/SUBMODULES.txt

          tar -czf "dist/suite-beta-${VERSION}-with-submodules.tar.gz" -C package suite-beta

      - name: Anexar pacote à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*-with-submodules.tar.gz