test_guidance:
  required_unit_tests:
    - "Cada forbidden_output_fragment deve ser removido do output semântico."
    - "Cada strong_signal deve ter pelo menos um teste positivo."
    - "Cada negative_context deve ter pelo menos um teste que impeça falso positivo."
    - "Negação explícita deve reduzir pontuação da categoria negada."
    - "Ticket resolvido deve eliminar pendência histórica encerrada."
    - "A mesma entrada deve produzir a mesma classificação em execuções repetidas."
    - "ID e protocol devem produzir interpretação equivalente."
    - API e erro 403 isolados não podem classificar API sem contexto técnico de endpoint/requisição.
    - Máquina offline deve ser desambiguada entre inoperância, rede e status de sistema.
    - Conteúdo de e-mail citado/reencaminhado não pode duplicar eventos semânticos.
    - Mensagem composta pode gerar action_done e pending_open distintos.
    - Confirmação de recebimento deve encerrar pendência de envio semanticamente correspondente.
  required_regression_tickets:
    - 6246
    - 6277
    - 6264
    - 6255
    - 6272
    - 6244
    - 6226
    - 6188
    - 6207
    - 6125
    - 6176
    - 6140
    - 6150
    - 6211
    - 6132
  acceptance:
    - "Nenhum HTML/atributo DOM aparece em campos semânticos."
    - "Mensagens bot não são usadas como relato ou evidência."
    - "Assinaturas não influenciam resumo ou classificação."
    - "Autenticação exige contexto causal de falha."
    - "RFID, biometria e senha como procedimento/cadastro não causam falso positivo."
    - "Casos explícitos de máquina não ficam não classificado."
    - "Tickets pobres permanecem conservadores e não inventam informação."
    - Códigos HTTP isolados não determinam API sem contexto.
    - Offline é classificado pelo objeto/contexto e não pela palavra isolada.
    - E-mails citados e disclaimers não duplicam evidências.
    - Solicitações administrativas não viram incidentes por termos acessórios.
