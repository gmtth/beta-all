  source_context:
    rule: 'Pontuar somente cláusulas semanticamente elegíveis. O papel do autor não basta: uma fala do agente pode
      ser pergunta, instrução, hipótese, constatação ou exemplo. Bots e ruído têm pontuação zero.'
    eligible:
      - assertion explícita do cliente sobre o problema
      - constatação explícita da equipe
      - nota interna factual
      - assunto com sinal forte explícito
    zero_score:
      - bot/systemMessage
      - assinatura ou disclaimer
      - e-mail citado/reencaminhado duplicado
      - pergunta da equipe sem constatação
      - instrução/procedimento
      - exemplo hipotético introduzido por por exemplo
    subject_rule: O assunto pode satisfazer um strong_signal explícito, mas termos universais fracos no 
      assunto continuam valendo apenas weak_mention.
    official_category_rule: officialCategory é metadado preservado e não adiciona pontos ao classificador 
      analítico.
disambiguation:

  authentication_terms:
    weak_mentions:
      - "senha"
      - "biometria"
      - "RFID"
      - "autenticação"
    rule: >
      Esses termos isolados valem no máximo weak_mention. Exigir verbo/estado de
      falha causal para classificar acesso e autenticação.
    causal_failures:
      - "incorreta"
      - "inválida"
      - "não reconhece"
      - "não aceita"
      - "não autentica"
      - "falha na leitura"
      - "não consegue entrar"

  machine_term:
    weak_mentions:
      - "máquina"
      - "equipamento"
    rule: >
      A palavra máquina isolada nunca determina categoria. Exigir estado operacional
      ou impacto associado.

  not_appearing:
    rule: "Resolver o objeto antes de classificar."
    mappings:
      - object: ["funcionário", "matrícula", "GHE", "cadastro"]
        category: "cadastro e sincronização"
      - object: ["ficha", "relatório", "produto na ficha"]
        category: "relatórios e fichas"
      - object: ["produto para entrega", "item na entrega manual"]
        category: "entrega manual e processo operacional"

  negation:
    markers:
      - "não é"
      - "não foi"
      - "não foram"
      - "sem"
      - "não encontrei"
    rule: >
      Detectar escopo de negação antes da pontuação. Ex.: "não foi erro de sistema"
      deve reduzir erro de sistema, não aumentar.

  comparison:
    patterns:
      - "na máquina X, no balcão Y"
      - "em algumas tentativas X, em outras Y"
      - "no sistema A X, no sistema B Y"
    rule: >
      Comparações são evidências fortes porque ajudam a localizar o domínio do
      problema sem inferir causa raiz.

  offline_scope:
    rule: Resolver o objeto e o contexto de offline antes de pontuar.
    mappings:
      - context:
          - máquina
          - equipamento
        without:
          - rede
          - firewall
          - porta
          - endereço
          - teste de rede
        category: máquina inoperante
      - context:
          - rede
          - firewall
          - porta
          - endereço
          - teste de rede
          - comunicação
        category: rede e conectividade
      - context:
          - site
          - WEB
          - sistema
          - módulos
        category: erro de sistema
    guard: Se a máquina estiver explicitamente entregando normalmente, reduzir máquina inoperante mesmo que 
      exista alerta de rede.
  http_status_codes:
    rule: Código HTTP isolado não define domínio do problema.
    mappings:
      - if_context:
          - sessão
          - login
          - token
          - autenticação
          - credenciais
        prefer: acesso e autenticação
      - if_context:
          - API
          - endpoint
          - requisição
          - integração técnica
        prefer: API e integração
      - if_context:
          - site
          - WEB
          - indisponibilidade geral
          - múltiplos módulos
        prefer: erro de sistema
  request_vs_incident:
    rule: Distinguir solicitação administrativa/operacional de falha. Pedidos de criar usuário, enviar insumo 
      ou agendar treinamento não devem ser convertidos em categoria de erro apenas porque contêm senha, 
      máquina, biometria ou sistema.
    request_examples:
      - solicito o cadastro dos novos colaboradores
      - precisaremos de 1000 grampos
      - preciso agendar um treinamento
  compound_messages:
    rule: 'Uma mensagem pode conter fatos de categorias diferentes. Ex.: usuário criado + treinamento ainda a agendar.
      Extrair os eventos separadamente e deixar o scoring/multi_issue decidir predominância.'
    source_example_ticket: 6150
summarize_output:
  recommended_shape:
    id: "string"
    protocol: "string"
    reportedProblem:
      type: "array[string]"
      max_items: 4
    actionsTaken:
      type: "array[string]"
      max_items: 6
    pendingItems:
      type: "array[string]"
      max_items: 6
    evidence:
      type: "array[string]"
      max_items: 6
    hypotheses:
      type: "array[string]"
      max_items: 4
    confidence:
      type: "low|medium|high"
    incomplete:
      type: "boolean"
  note: >
    Caso o schema público atual use string em reportedProblem ou summary, o MCP pode
    juntar os itens com pontuação sem reescrever semanticamente os fatos.

confidence:
  summarize:
    high:
      requirements:
        - "problema explícito identificado"
        - "duas ou mais evidências relevantes ou uma constatação técnica forte"
        - "papéis e mensagens segmentados com sucesso"
      downgrade:
        - "ticket multiassunto"
        - "texto principal disponível somente no assunto"
        - "parsing parcial"
        - conteúdo dominado por e-mail citado/reencaminhado
        - mensagem multiassunto sem segmentação confiável
    medium:
      requirements:
        - "problema razoavelmente identificável"
      common_cases:
        - "poucas mensagens"
        - "mais de um assunto"
        - "evidência limitada"
    low:
      common_cases:
        - "somente assunto"
        - "mensagens insuficientes"
        - "parser não conseguiu identificar papéis"
        - campos semânticos ainda contêm fragmentos proibidos
        - não foi possível separar conteúdo novo de e-mail citado
  classify:
    rule: "Derivar dos thresholds de scoring e da margem para a segunda categoria."

safety_fallbacks:
  parser_failure:
    detect_if_any:
      - "forbidden_output_fragments presentes após normalização"
      - "nenhuma mensagem segmentada em action com htmlDescription de chat"
    behavior:
      - "não usar fragmento HTML como reportedProblem"
      - "não usar fragmento HTML como evidence"
      - "reduzir confidence para low"
      - "usar description limpa ou assunto como fallback"
      - "registrar diagnóstico técnico interno"
  insufficient_information:
    behavior:
      - "reportedProblem pode usar assunto como fallback"
      - "actionsTaken deve ser vazio se não houver ação explícita"
      - "pendingItems deve ser vazio se não houver obrigação explícita"
      - "hypotheses deve ser vazio se não houver causalidade incerta explícita"
      - "category deve ser não classificado quando necessário"
  transient_api_failure:
    behavior:
      - "retornar erro controlado"
      - "não retornar ticket inexistente"
      - "não produzir resultado parcial válido"
      - "permitir retry sem alterar classificação"

  quoted_email_failure:
    detect_if_any:
      - bloco citado domina o texto normalizado
      - mesmo conteúdo aparece repetido por replies/forwards
    behavior:
      - não duplicar fatos do histórico citado
      - preservar somente o conteúdo novo quando separável
      - reduzir confidence se não for possível separar com segurança
