schema_version: "1.1"
ruleset_version: "2026.08.16.1"
name: "movidesk_semantic_models"
language: "pt-BR"
phase: "3A"

meta:
  purpose: >
    Fonte externa de regras e modelos semânticos determinísticos para
    movidesk_summarize_ticket e movidesk_classify_ticket_issue.
    O arquivo deve ser atualizado sem necessidade de alterar as regras no código,
    sempre que novos padrões reais de fala forem identificados nos tickets.
  scope:
    - "Normalização e segmentação de mensagens de chat"
    - "Identificação de relato, ação, pendência, evidência, hipótese, instrução e confirmação"
    - "Classificação analítica conservadora por sinais explícitos e contexto causal"
    - "Desambiguação de termos como senha, biometria, RFID, máquina, rede e ficha"
  out_of_scope:
    - "Inferir causa raiz não escrita no ticket"
    - "Inventar solução, ação, pendência ou hipótese"
    - "Substituir a categoria oficial do Movidesk"
    - "Alterar o conteúdo bruto retornado por movidesk_get_ticket_timeline"
    - "Usar modelo generativo dentro do MCP para completar lacunas"
  data_basis:
    period_reviewed: "2026-08-01..2026-08-16"
    tickets_reviewed_directly:
      - 6246
      - 6277
      - 6264
      - 6255
      - 6272
      - 6244
      - 6252
      - 6280
      - 6278
      - 6274
      - 6263
      - 6226
      - 6188
      - 6125
      - 6211
      - 6176
      - 6207
      - 6140
      - 6150
      - 6132
    additional_patterns_reviewed_from_recent_search:
      - 6132
      - 6141
      - 6128
      - 6133
      - 6136
      - 6125
      - 6140
      - 6145
      - 6138
    note: >-
      Os exemplos abaixo representam padrões observados na integração atual. Eles não devem ser usados como igualdade
      textual obrigatória; são padrões semânticos determinísticos para reconhecer estruturas equivalentes, sempre
      com contexto e regras de desambiguação.
    expanded_live_review_at: '2026-08-16'
  maintenance:
    preferred_format: "YAML"
    change_rule: >
      Preferir adicionar ou ajustar sinais neste arquivo. Alterar código apenas
      quando houver mudança estrutural de parsing, algoritmo ou schema.
    review_rule: >
      Qualquer nova regra deve ter pelo menos um exemplo positivo e, quando houver
      risco de falso positivo, um exemplo negativo.
    backwards_compatibility: >
      Novas categorias ou campos devem ser introduzidos com versionamento de schema.
      Não renomear labels públicas existentes sem migração explícita.

invariants:
  - id: "timeline_raw"
    rule: "Nunca aplicar esta limpeza ao summary bruto da timeline."
  - id: "official_category"
    rule: "officialCategory deve permanecer exatamente como retornada pelo Movidesk."
  - id: "no_root_cause"
    rule: "category não representa causa raiz; representa o problema analítico predominante observável."
  - id: "no_invention"
    rule: "Quando não houver evidência suficiente, usar não classificado e confidence low."
  - id: "explicit_over_implicit"
    rule: "Fatos explícitos têm prioridade sobre inferências por palavras isoladas."
  - id: "context_over_keyword"
    rule: "Uma menção a senha, biometria ou RFID não basta para classificar autenticação."
  - id: "temporal_state"
    rule: "Pendências devem ser calculadas considerando eventos posteriores que possam encerrá-las."
  - id: "resolved_default"
    rule: >
      Ticket Resolvido ou Fechado deve resultar em pendingItems vazio, exceto quando
      houver registro posterior explícito indicando obrigação ainda aberta.
  - id: "multi_issue"
    rule: >
      Em ticket multiassunto, escolher o problema predominante e reduzir confiança
      quando houver disputa real entre categorias.

  - id: bounded_ruleset
    rule: Não adicionar palavras isoladas apenas para aumentar cobertura. Preferir grupos contextuais, 
      negações e exemplos de regressão.
parser:
  source_priority:
    chat:
      - "htmlDescription"
      - "description"
    ordinary_action:
      - "description"
      - "htmlDescription"

  html_chat:
    message_container_selector: ".message-container"
    role_attribute: "data-person-role"
    known_classes:
      received: "client"
      sended: "agent"
      systemMessage: "bot"
    output_fields:
      - "date"
      - "time"
      - "role"
      - "author"
      - "text"
      - "message_id"
      - "source_action_id"
      - "source_index"

  normalization_pipeline:
    - "Parsear HTML com parser DOM; não extrair mensagens por substring de atributos."
    - "Selecionar cada .message-container individualmente."
    - "Ler data-person-role antes de remover atributos."
    - "Extrair somente texto visível do conteúdo da mensagem."
    - "Decodificar entidades HTML, incluindo &nbsp;, &#233;, &amp; e equivalentes."
    - "Remover tags, atributos style, data-id, data-person-id, message-ids e classes."
    - "Normalizar espaços e quebras de linha sem juntar mensagens diferentes."
    - "Preservar autor, papel, data e ordem cronológica em campos separados."
    - "Eliminar mensagens vazias após a normalização."
    - "Executar filtros de boilerplate somente depois da segmentação."

    - Remover conteúdo de e-mail citado/reencaminhado antes da extração semântica para evitar duplicar fatos 
      antigos.
    - 'Tratar referências cid:, mailto: e blocos de disclaimer como metadados/ruído, não como conteúdo semântico.'
    - Em mensagens compostas, permitir extrair mais de um evento semântico quando houver ação concluída e 
      pendência futura distintas.
  forbidden_output_fragments:
    - "data-person-role="
    - "message-ids="
    - "data-person-id="
    - "style="
    - "<div"
    - "</div>"
    - "class=\"message-container"
    - "&#"
    - "&nbsp;"

  role_map:
    client:
      semantic_name: "cliente"
      default_relevance: "high"
    agent:
      semantic_name: "equipe"
      default_relevance: "high"
    bot:
      semantic_name: "sistema"
      default_relevance: "ignore"
    unknown:
      semantic_name: "desconhecido"
      default_relevance: "low"

  clause_segmentation:
    rule: Depois de segmentar mensagens, dividir texto em cláusulas/sentenças operacionais quando houver 
      marcadores claros. Pontuar cada cláusula separadamente para impedir que uma pergunta ou exemplo 
      hipotético contamine um fato da mesma mensagem.
    question_markers:
      - '?'
      - poderia
      - saberia
      - teria como
      - pode nos confirmar
    hypothetical_example_markers:
      - por exemplo
      - 'exemplo:'
      - como exemplo
    instruction_markers:
      - tente
      - acesse
      - clique
      - selecione
      - pressione
      - oriente
    rule_priority:
      - negação explícita
      - hipótese causal explícita
      - constatação/asserção factual
      - confirmação
      - instrução
      - pergunta/exemplo hipotético
filters:
  automatic_messages:
    contains:
      - "Olá! Seja bem-vindo(a) ao suporte da CenciHUB"
      - "Em instantes você será atendido por um dos nossos analistas"
      - "Informe os dados abaixo e aguarde"
      - "Entrou na conversa"
      - "Finalizou a conversa"
      - "estamos encerrando este chat e transformando em ticket"
      - "Caso necessário, retornaremos o contato via e-mail"
      - "Estamos à disposição!"
      - Mensagem ativa (HSM)
      - precisamos conversar sobre o ticket
      - Por favor responda esta mensagem para darmos seguimento
    action: "ignore_semantically"
    preserve_in_timeline: true

  greetings_and_smalltalk:
    patterns:
      - "bom dia"
      - "boa tarde"
      - "boa noite"
      - "tudo bem"
      - "tudo certo"
      - "bem e vc"
      - "obrigado"
      - "obrigada"
      - "tenha um ótimo dia"
      - "perfeito então"
    rule: >
      Ignorar quando a mensagem contém somente saudação, agradecimento ou smalltalk.
      Não ignorar se a mesma mensagem também contém fato operacional relevante.

  signatures:
    start_markers:
      - "Att,"
      - "Atte,"
      - "Analista de Suporte"
      - "Supervisora de sistemas"
      - "Canais oficiais de atendimento"
      - "Horário de atendimento"
      - "WhatsApp Suporte Técnico"
      - "E-mail SAC"
      - "Office phone"
      - Atenciosamente / Best Regards
      - Disclaimer
      - 'AVISO:'
      - 'WARNING:'
      - 'IMPORTANTE:'
      - 'IMPORTANT:'
    rule: >
      Quando marcador de assinatura for encontrado após conteúdo operacional,
      preservar somente o conteúdo anterior ao início da assinatura.
      Nunca usar telefone, e-mail, cargo ou horário de atendimento como evidência.

  attachments:
    patterns:
      - "Anexos:"
      - "Attachments:"
      - "| Download"
    rule: >
      A existência de anexo pode ser preservada como metadado, mas o nome/tamanho
      do arquivo isoladamente não deve ser relato, ação, evidência ou hipótese.

  quoted_email_and_disclaimers:
    start_markers:
      - ________________________________
      - 'De: '
      - 'From: '
      - 'Enviado: '
      - 'Sent: '
      - 'Para: '
      - 'To: '
      - 'Assunto: '
      - 'Subject: '
      - '[E-MAIL EXTERNO]'
      - '[EXTERNAL E-MAIL]'
      - 'CAUTION: This is an external email'
      - ⚠ EXTERNAL E-MAIL
    inline_noise_patterns:
      - 'cid:'
      - 'mailto:'
      - Please consider the environment before printing this e-mail
      - This message may contain confidential information
      - Este e-mail é confidencial
    rule: Quando uma resposta contém o histórico de e-mail citado, preservar apenas o novo conteúdo anterior 
      ao bloco citado. Disclaimers, alertas de e-mail externo, links mailto e referências cid não podem gerar 
      relato, ação, evidência, pendência ou hipótese.
semantic_types:

  reported_problem:
    description: >
      Manifestação factual do cliente sobre comportamento inesperado, necessidade,
      impossibilidade, divergência ou impacto.
    allowed_roles:
      - "client"
    preferred_position:
      - "primeiras mensagens relevantes do cliente"
      - "complementos posteriores do cliente que qualificam impacto ou escopo"
    positive_markers:
      failure:
        - "não consegue"
        - "não consigo"
        - "não aparece"
        - "não está aparecendo"
        - "não gerou"
        - "não reconhece"
        - "não aceita"
        - "não deixa"
        - "não permite"
        - "não funciona"
        - "não entrega"
        - "está travada"
        - "está offline"
        - "senha incorreta"
        - "mensagem de erro"
        - "divergência"
        - "incorreto"
        - "faltando"
        - material não sai
        - fica registrado como se tivesse sido retirado
        - site está offline
        - interrupção do acesso WEB
        - não estão sendo refletidas
        - matrículas não aparecem
        - faltando itens na ficha
        - segue sem conseguir encontrar
        - continua com erro
      request:
        - "preciso de ajuda"
        - "poderia me ajudar"
        - "gostaria de solicitar"
        - "teria como"
        - "preciso saber"
      impact:
        - "muitos colaboradores"
        - "mais de 200"
        - "todos estão assim"
        - "acontece com frequência"
        - "não conseguem realizar a retirada"
        - operação parada
        - comprometeu o reabastecimento
        - compromete nossas operações
        - funcionários estão sem registros
        - não consigo fazer nenhum cadastro
    exclusions:
      - "perguntas feitas pela equipe"
      - "instruções da equipe"
      - "mensagens de encerramento"
      - "assinaturas"
      - "boas-vindas"
    max_items: 4
    examples:
      positive:
        - source_ticket: 6246
          text: "muitas reclamações de colaboradores que tentam acessar a máquina e consta senha incorreta"
        - source_ticket: 6141
          text: "colaborador não consegue retirar EPI da máquina; a máquina não reconhece sua senha"
        - source_ticket: 6264
          text: "lançamos um sapato mas não gerou a ficha"
        - source_ticket: 6255
          text: "a máquina está com a tela travada e não permite digitar a numeração"
        - source_ticket: 6252
          text: "teria como vocês mandarem mais plásticos para a máquina"
      negative:
        - text: "Poderia me responder algumas questões para auxiliar na análise?"
          reason: "pergunta da equipe"
        - text: "Estamos à disposição!"
          reason: "boilerplate"

  action_done:
    public_field: "actionsTaken"
    description: "Ação já executada ou constatação operacional registrada pela equipe."
    allowed_roles:
      - "agent"
    strong_markers:
      - "foi realizada"
      - "foi realizado"
      - "realizamos"
      - "verificamos"
      - "foi verificado"
      - "foi constatado"
      - "constatamos"
      - "identificamos"
      - "foi identificado"
      - "encaminhamos"
      - "foi encaminhado"
      - "passei para o time"
      - "usuário criado com sucesso"
      - "separamos"
      - "foi feita a separação"
      - "ajustamos"
      - "corrigimos"
      - "desabilitamos"
      - "realizamos a desabilitação"
      - foi executado
      - executamos
      - foram sincronizadas corretamente
      - processamento foi normalizado
      - reinício dos serviços
      - serviços foram reiniciados
      - usuários criados
      - usuário foi criado
      - treinamento foi realizado
      - realizamos o envio
      - foram recebidos
      - validamos junto
      - endereços de rede foram liberados
      - foi ajustado
      - corrigimos a exibição
    completion_required: true
    reject_future_or_intent:
      - "vou verificar"
      - "irei verificar"
      - "vamos verificar"
      - "estamos verificando"
      - "deverá ser aberto"
      - "será aberto"
      - "vamos abrir"
      - "poderia realizar"
      - "tente realizar"
      - "aguardamos"
      - "assim que"
      - continuamos analisando
      - seguiremos acompanhando
      - vamos comparar
      - iremos passar
      - vamos repassar
      - vou passar
      - estou em contato
      - iremos investigar
    examples:
      positive:
        - source_ticket: 6246
          text: "Em verificação junto à Power, foi constatado que o mesmo funcionário usou a mesma senha em várias
            interações."
        - source_ticket: 6125
          text: "Identificamos uma inconsistência na classificação dos produtos entre as Fichas de EPI e as Fichas
            de Produtos."
        - source_ticket: 6140
          text: "Usuário criado com sucesso."
      negative:
        - text: "Vou verificar a situação."
          reason: "intenção futura"
        - text: "Deverá ser aberto um card."
          reason: "ação ainda não executada"

    compound_event_rule: Se a mesma mensagem disser que um encaminhamento foi realizado e que uma validação 
      ainda ocorrerá, registrar o encaminhamento em actionsTaken e a validação futura em pendingItems, sem 
      fundir os dois estados.
  action_future:
    internal_type: "todo_action"
    public_destination: "pendingItems_when_still_open"
    markers:
      - "vou verificar"
      - "irei verificar"
      - "vamos verificar"
      - "deverá ser aberto"
      - "será aberto"
      - "vamos abrir"
      - "vou passar para"
      - "precisa validar"
      - "é necessário validar"
      - "precisamos confirmar"
      - "aguardamos retorno"
      - "aguardando retorno"
      - "assim que retornarem"
      - "assim que houver atualização"
      - vou passar esses usuários
      - vamos repassar para o time
      - vamos comparar
      - seguiremos acompanhando
      - pode nos confirmar
      - favor informar quando
      - é necessário aguardar
      - aguardar a conclusão
      - estou em contato com os técnicos
    examples:
      - source_ticket: 6246
        text: "Deverá ser aberto um card a respeito dessa situação."
      - source_ticket: 6132
        text: "Aguardamos o retorno do seu time de TI para a liberação de rede da máquina."

  pending_open:
    description: "Evento que cria uma obrigação ainda não comprovadamente concluída."
    markers:
      - "aguardamos"
      - "aguardando"
      - "precisa validar"
      - "é necessário validar"
      - "poderia confirmar"
      - "poderia enviar"
      - "necessário enviar"
      - "deverá ser aberto"
      - "será aberto"
      - "vamos retornar"
      - "assim que houver"
      - "assim que retornarem"
      - "ficou de validar"
      - "vai validar"
      - "precisa verificar"
      - "encaminhado para análise"
      - "time está analisando"
      - fico no aguardo
      - aguardo retorno
      - pode nos confirmar
      - favor informar quando
      - é necessário aguardar
      - aguardar a conclusão
      - validar novos cadastros
      - confirmar com
      - aguardando retorno do
    identity_hints:
      - "objeto da validação"
      - "ator responsável"
      - "entidade/ticket/card/endereço/evidência aguardada"
    examples:
      - source_ticket: 6246
        text: "encaminhado ao time interno para análise"
      - source_ticket: 6252
        text: "confirmar o endereço antes do envio"
      - source_ticket: 6244
        text: "cliente iria validar internamente antes de prosseguir"

  pending_close:
    description: "Evento posterior que encerra uma pendência semanticamente equivalente."
    markers:
      success:
        - "deu certo"
        - "consegui"
        - "conseguimos"
        - "funcionou"
        - "resolvido"
        - "foi realizado"
        - "foi confirmado"
        - "confirmado"
        - "já foi enviado"
        - "já foi aberto"
        - "já foi encaminhado"
        - "retorno recebido"
        - "validado"
        - foram recebidos
        - foram sincronizadas corretamente
        - processamento foi normalizado
        - usuário foi criado
        - usuários criados
        - treinamento foi realizado
        - endereços de rede foram liberados
        - máquinas seguem entregando normalmente
        - já pode acessar o sistema
      negative_resolution:
        - "não é necessário"
        - "não se aplica"
        - "cliente desistiu"
        - "cancelado"
    temporal_rule: >
      Fechar somente pendência semanticamente compatível e anterior.
      Não remover pendência diferente apenas porque apareceu uma mensagem de sucesso.
    final_status_override:
      statuses:
        - "Resolvido"
        - "Fechado"
        - "Cancelado"
      default_pending_items: []
      exception: "mensagem posterior explícita ao fechamento que crie nova obrigação"

  evidence:
    description: >
      Fato observável, constatação, comparação ou confirmação que sustenta o
      entendimento do ticket sem inferir causa raiz.
    preferred_roles:
      - "client"
      - "agent"
    strong_markers:
      - "foi constatado"
      - "foi identificado"
      - "identificamos"
      - "não foram identificados"
      - "foi possível constatar"
      - "foi possível identificar"
      - "no balcão funciona"
      - "na máquina não"
      - "mesma senha"
      - "em algumas tentativas"
      - "em outras interações"
      - "está offline desde"
      - "retornou erro"
      - "não gerou"
      - "aparece no"
      - "não aparece no"
      - material não sai e fica registrado como se tivesse sido retirado
      - localizados no Apollus porém não estão sendo refletidos no CenciHUB
      - filas de processamento estavam paradas
      - registros pendentes voltaram a ser sincronizados
      - processamento foi normalizado
      - site está novamente Offline
      - usuário conseguiu realizar acesso ao sistema
      - máquinas seguem entregando normalmente
      - regras foram implementadas com sucesso
      - grampos foram recebidos
      - treinamento foi realizado
    ranking:
      - "constatação técnica específica"
      - "comparação reproduzível entre dois fluxos"
      - "confirmação do cliente após teste"
      - "impacto/escopo quantificado"
      - "assunto do ticket como fallback"
    max_items: 6
    subject_fallback_only: true
    examples:
      - source_ticket: 6246
        text: "a mesma senha foi aceita em algumas interações e considerada incorreta em outras"
      - source_ticket: 6141
        text: "no balcão o funcionário consegue retirar com a mesma senha"
      - source_ticket: 6136
        text: "o servidor estava recusando requisições de atualização dos status da máquina"
      - source_ticket: 6255
        text: "a tela da máquina está travada e não permite digitar a numeração"

  hypothesis:
    public_field: "hypotheses"
    description: "Possibilidade causal explicitamente escrita e ainda não comprovada."
    uncertainty_required: true
    causal_markers:
      - "pode ter relação"
      - "pode estar relacionado"
      - "pode ser"
      - "talvez"
      - "possivelmente"
      - "possível relação"
      - "suspeita"
      - "hipótese"
      - "verificar se não pode"
      - "avaliar se"
      - "pode estar causando"
      - pode estar partindo do equipamento
      - pode solucionar
      - pode ter ocorrido
      - o que pode estar acontecendo
    reject:
      - "pergunta operacional sem proposta causal"
      - "ação futura"
      - "encaminhamento"
      - "aguardando retorno"
      - "mensagem de acompanhamento"
      - "instrução de procedimento"
      - explicação causal declarada como fato confirmado
      - causa informada após identificação/constatação
    examples:
      positive:
        - source_ticket: 6246
          text: "verificar se não pode ter relação com os zeros à esquerda"
      negative:
        - source_ticket: 6264
          text: "é possível fazer esse registro de entrega um dia antes também?"
          reason: "dúvida operacional, não hipótese causal"
        - source_ticket: 6246
          text: "deverá ser aberto um card"
          reason: "ação futura, não hipótese"

  instruction:
    description: "Procedimento recomendado pela equipe; não é automaticamente ação concluída."
    markers:
      - "tente realizar"
      - "acesse"
      - "clique"
      - "selecione"
      - "posicione"
      - "aguarde"
      - "pressione"
      - "vá até"
      - "basta"
      - "tem que"
      - "é só"
    examples:
      - source_ticket: 6264
        text: "selecione Tipo de autenticação > Biometria e depois clique em Fazer Pedido"
    public_field:

  confirmation:
    description: "Confirmação de resultado do cliente ou equipe."
    markers:
      success:
        - "deu certo"
        - "consegui"
        - "conseguimos"
        - "funcionou"
        - "agora foi"
        - "está correto"
        - "resolvido"
        - foram recebidos
        - já pode acessar
        - foram sincronizadas corretamente
        - voltaram a ser sincronizados
        - entregando normalmente
        - voltaram a operar como esperado
        - treinamento foi realizado
      failure:
        - "não deu certo"
        - "continua"
        - "ainda não"
        - "permanece"
        - "segue com erro"
        - problema persiste
        - site está novamente offline
        - seguimos sem conseguir
        - ainda não constam
    use:
      - "fechar ou manter pendências"
      - "aumentar força de evidência"
      - "não transformar automaticamente em causa"

  pending_matching:
    description: Pareamento determinístico entre obrigação aberta e evento posterior que a satisfaz ou 
      invalida.
    object_keys:
      - usuário
      - matrícula
      - GHE
      - cadastro
      - sincronização
      - envio
      - recebimento
      - endereço
      - rede
      - visita
      - treinamento
      - teste
      - card
      - retorno
    rules:
      - Extrair uma chave de objeto explícita da pendência quando possível.
      - Fechar apenas com evento posterior que compartilhe a mesma chave de objeto ou uma relação declarada de
        conclusão.
      - Não usar apenas proximidade textual ou a palavra resolvido para parear pendências diferentes.
      - O status final Resolvido/Fechado continua sendo override de segurança para pendências históricas, 
        salvo nova obrigação posterior.
  issue_transfer:
    description: Registro explícito de que um subproblema foi desmembrado ou transferido para outro protocolo.
    markers:
      - desmembrando este chamado para um novo protocolo
      - novo protocolo de atendimento
      - continuamos tratando do
      - através do protocolo
      - chamado relacionado a
      - foi encerrado e continuamos tratando
    rule: Quando o texto nomear explicitamente o subproblema transferido e o novo protocolo, marcar esse 
      tópico como transferido. Não manter uma pendência do tópico transferido no ticket de origem após o 
      encerramento explícito; preservar a evidência histórica.
    source_examples:
      - 6132
      - 6207
classification:
  philosophy: >
    Classificação conservadora por evidências explícitas. A categoria analítica
    deve representar o problema predominante observado, nunca causa raiz.
    Termos isolados são sinais fracos; combinações causais são sinais fortes.

  scoring:
    points:
      strong_explicit_signal: 6
      contextual_signal: 3
      supporting_signal: 2
      weak_mention: 1
      explicit_negative_context: -6
      contradictory_evidence: -4
    thresholds:
      minimum_to_classify: 6
      medium_confidence: 8
      high_confidence: 13
    dominance:
      high_margin: 6
      medium_margin: 3
      ambiguous_margin_max: 2
      rule: >
        Se as duas maiores categorias ficarem com diferença menor ou igual a 2,
        escolher a maior somente se houver pelo menos um strong_explicit_signal;
        caso contrário retornar não classificado ou confidence low/medium.
    multi_issue:
      max_compatible_categories: 3
      confidence_penalty_when_multiple_strong_categories: 1

  universal_weak_terms:
    - "erro"
    - "problema"
    - "máquina"
    - "sistema"
    - "senha"
    - "biometria"
    - "RFID"
    - "cadastro"
    - "API"
    - "ficha"
    - "rede"
    - "produto"
    - "funcionário"

