name: Release with submodules

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release a empacotar"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Sincronizar submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Atualizar submodules para os commits mais recentes
        shell: bash
        run: |
          git submodule foreach --recursive '
            git fetch --prune origin

            branch=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD || true)

            if [ -z "$branch" ]; then
              default_branch=$(git remote show origin | sed -n "/HEAD branch/s/.*: //p")
              branch="origin/$default_branch"
            fi

            git checkout --detach "$branch"
          '

      - name: Registrar commits incorporados
        shell: bash
        run: |
          git submodule status --recursive > SUBMODULES.txt
          cat SUBMODULES.txt

      - name: Empacotar projeto com submodules
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          SAFE_VERSION="${VERSION//\//-}"

          mkdir -p dist

          tar \
            --exclude-vcs \
            --exclude='./dist' \
            -czf "dist/suite-beta-${SAFE_VERSION}-with-submodules.tar.gz" \
            .

          test -s "dist/suite-beta-${SAFE_VERSION}-with-submodules.tar.gz"

      - name: Publicar artefato na release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: dist/*-with-submodules.tar.gz